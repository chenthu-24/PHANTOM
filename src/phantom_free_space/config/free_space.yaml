scan_topic: "/scan"
num_sectors: 36
safety_distance: 0.45
# Extra LiDAR obstacle inflation in meters. Tune from real robot width, wheel overhang,
# control tracking error, and desired safety margin.
obstacle_inflation_m: 0.22
front_stop_clearance_m: 0.30
side_stop_clearance_m: 0.24
front_sector_half_angle_rad: 0.28
front_side_sector_min_rad: 0.28
front_side_sector_max_rad: 0.95
direction_lock_time_sec: 0.45
direction_switch_margin: 0.18
heading_change_penalty: 0.08
max_range: 6.0
min_valid_points_per_sector: 3
forward_weight: 0.35
clearance_weight: 0.45
width_weight: 0.20
image_size: 800
meters_per_pixel: 0.01
debug_dir: "~/free_space_debug"
save_every_n_frames: 5
publish_rate_limit_hz: 10.0
